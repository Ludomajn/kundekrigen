<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundekrigen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/filmintro.css">
</head>
<body>

<!-- Ikonsprite. Pilen bruges som vindmåler og som markør over den aktive
     kunde; telefonrøret er logoet. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 64 40">
    <path d="M4 14h30V4l26 16-26 16V26H4z"/>
  </symbol>
  <symbol id="i-logo" viewBox="0 0 64 40">
    <path d="M14 30c-5-6-6-15-2-21l6-3 5 8-4 4c1 4 4 8 8 10l4-3 8 5-3 6c-8 2-16-1-22-6z"/>
    <circle cx="44" cy="10" r="3"/><circle cx="52" cy="8" r="2.4"/><circle cx="58" cy="13" r="2"/>
  </symbol>

  <!-- Våbenikoner. Tegnet som simple, kraftige former, så de er læsbare ved
       14 px i favoritbjælken og ved 32 px i våbenpanelet. -->
  <!-- Våbenikoner, tema "Kundekrigen": klinikkens IT-arsenal. Ét farvelag
       (currentColor) plus gennemsigtighed, så de følger bjælkens tilstand. -->
  <symbol id="v-grenroer" viewBox="0 0 32 32"><!-- Tonerkanon -->
    <rect x="3" y="12" width="22" height="8" rx="3" fill="currentColor"/>
    <rect x="15" y="12.5" width="6" height="7" rx="1" fill="currentColor" opacity=".45"/>
    <path d="M25 11h4v10h-4z" fill="currentColor"/>
    <rect x="9" y="19" width="3" height="6" rx="1" fill="currentColor"/>
  </symbol>
  <symbol id="v-egegranat" viewBox="0 0 32 32"><!-- Datalæk-bomben -->
    <circle cx="14" cy="19" r="10" fill="currentColor"/>
    <rect x="4.5" y="17" width="19" height="4.5" fill="#fff" opacity=".45" transform="rotate(-12 14 19)"/>
    <circle cx="10.5" cy="14.5" r="2" fill="#fff" opacity=".55"/>
    <rect x="19" y="7.5" width="5" height="4" rx="1" fill="currentColor" transform="rotate(40 21.5 9.5)"/>
    <path d="M23 7c1-3 3-4 5-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="28.5" cy="3.5" r="2" fill="currentColor" opacity=".7"/>
  </symbol>
  <symbol id="v-koglebombe" viewBox="0 0 32 32"><!-- Integrations inferno -->
    <rect x="3" y="10" width="26" height="13" rx="2.5" fill="currentColor"/>
    <g fill="#fff" opacity=".55">
      <rect x="6" y="13" width="3" height="2.5" rx=".6"/><rect x="10.5" y="13" width="3" height="2.5" rx=".6"/>
      <rect x="15" y="13" width="3" height="2.5" rx=".6"/><rect x="19.5" y="13" width="3" height="2.5" rx=".6"/>
      <rect x="24" y="13" width="2.5" height="2.5" rx=".6"/><rect x="9" y="18" width="14" height="2.5" rx=".8"/>
    </g>
    <circle cx="27" cy="7" r="2.4" fill="currentColor"/>
  </symbol>
  <symbol id="v-splintboesse" viewBox="0 0 32 32"><!-- Stregkodescanner -->
    <path d="M5 11h19l4 3v4H5z" fill="currentColor"/>
    <path d="M8 18h5l-2 9H7z" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.2" opacity=".6"><path d="M29 12l2-1M29 16h2M29 20l2 1"/></g>
  </symbol>
  <symbol id="v-dynamit" viewBox="0 0 32 32"><!-- Tvangsopdatering -->
    <rect x="2" y="8" width="17" height="16" rx="3" fill="currentColor"/>
    <path d="M14.5 13.5a4.5 4.5 0 1 0 .5 4" stroke="#fff" stroke-width="1.8" fill="none" opacity=".75" stroke-linecap="round"/>
    <path d="M15.8 10.8v3.6h-3.6z" fill="#fff" opacity=".75"/>
    <path d="M20 16h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
    <path d="M20 16h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="v-mine" viewBox="0 0 32 32"><!-- Phishing-mine -->
    <rect x="4" y="10" width="24" height="15" rx="2" fill="currentColor"/>
    <path d="M4.5 11l11.5 8 11.5-8" stroke="#fff" stroke-width="1.6" fill="none" opacity=".6"/>
    <path d="M24 9c3-2 3-5 0-6l-1 1c2 1 2 3-.5 4.5z" fill="currentColor"/>
  </symbol>
  <symbol id="v-hale" viewBox="0 0 32 32"><!-- Klageklask -->
    <rect x="8" y="4" width="16" height="24" rx="1.5" fill="currentColor"/>
    <rect x="8" y="4" width="4" height="24" fill="#fff" opacity=".3"/>
    <rect x="15" y="9" width="7" height="5" rx=".8" fill="#fff" opacity=".7"/>
  </symbol>
  <symbol id="v-gnavetand" viewBox="0 0 32 32"><!-- Hjemmearbejde -->
    <rect x="6" y="5" width="20" height="14" rx="2" fill="currentColor"/>
    <path d="M11.5 13l4.5-4 4.5 4v3.5h-9z" fill="#fff" opacity=".6"/>
    <path d="M4 21h24l2 4H2z" fill="currentColor"/>
    <rect x="13" y="22" width="6" height="1.4" rx=".7" fill="#fff" opacity=".45"/>
  </symbol>
  <symbol id="v-nedgravning" viewBox="0 0 32 32"><!-- Systemnedbrud -->
    <rect x="9" y="3" width="14" height="10" rx="2" fill="currentColor"/>
    <rect x="14" y="13" width="4" height="8" fill="currentColor" opacity=".7"/>
    <path d="M13 21h6l-3 8z" fill="currentColor"/>
  </symbol>
  <symbol id="v-teleport" viewBox="0 0 32 32"><!-- Fjernsupport -->
    <rect x="5" y="7" width="22" height="14" rx="2" fill="currentColor"/>
    <rect x="8" y="10" width="16" height="8" rx="1" fill="#fff" opacity=".4"/>
    <path d="M3 24h26l-2 3H5z" fill="currentColor"/>
    <path d="M14 12l5 2-5 2z" fill="currentColor"/>
  </symbol>
  <symbol id="v-airstrike" viewBox="0 0 32 32"><!-- Kvartalsopkrævning -->
    <path d="M7 3h13l5 5v21H7z" fill="currentColor"/>
    <path d="M20 3v5h5" fill="#fff" opacity=".35"/>
    <g fill="#fff" opacity=".55"><rect x="10" y="7" width="7" height="2" rx=".5"/><rect x="10" y="12" width="12" height="1.4" rx=".5"/>
      <rect x="10" y="15.5" width="12" height="1.4" rx=".5"/><rect x="15" y="23" width="7" height="2" rx=".5"/></g>
    <rect x="9" y="18" width="14" height="4.5" rx="1" fill="none" stroke="#fff" stroke-width="1.2" opacity=".8" transform="rotate(-14 16 20)"/>
  </symbol>
  <symbol id="v-covid" viewBox="0 0 32 32"><!-- COVID -->
    <circle cx="16" cy="16" r="8.5" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M16 7.5V3.5M16 24.5v4M7.5 16h-4M24.5 16h4M10 10l-2.8-2.8M22 22l2.8 2.8M22 10l2.8-2.8M10 22l-2.8 2.8"/>
    </g>
    <g fill="currentColor"><circle cx="16" cy="3" r="2"/><circle cx="16" cy="29" r="2"/><circle cx="3" cy="16" r="2"/>
      <circle cx="29" cy="16" r="2"/><circle cx="6.8" cy="6.8" r="2"/><circle cx="25.2" cy="25.2" r="2"/>
      <circle cx="25.2" cy="6.8" r="2"/><circle cx="6.8" cy="25.2" r="2"/></g>
    <g fill="#fff" opacity=".6"><circle cx="13" cy="14.5" r="1.5"/><circle cx="19" cy="14.5" r="1.5"/>
      <path d="M12.5 20c2-1.6 5-1.6 7 0" stroke="#fff" stroke-width="1.3" fill="none"/></g>
  </symbol>
  <symbol id="v-staaover" viewBox="0 0 32 32"><!-- Sæt på hold -->
    <path d="M7 5c2-1 4 0 5 2l1 3c.5 1.5 0 3-1 4l-1 1c1 3 3 5 6 6l1-1c1-1 2.5-1.5 4-1l3 1c2 1 3 3 2 5l-1 2c-8 1-19-10-18-18z" fill="currentColor"/>
  </symbol>
  <symbol id="v-overgiv" viewBox="0 0 32 32">
    <path d="M8 4v25" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M10 5h16l-4 6 4 6H10z" fill="currentColor"/>
  </symbol>
  <symbol id="v-papir" viewBox="0 0 32 32"><!-- Papirbunke -->
    <rect x="5" y="19" width="22" height="5" rx="1" fill="currentColor" opacity=".6"/>
    <rect x="4" y="14" width="22" height="5" rx="1" fill="currentColor" opacity=".8"/>
    <rect x="6" y="9" width="22" height="5" rx="1" fill="currentColor"/>
  </symbol>
  <symbol id="v-rampe" viewBox="0 0 32 32"><!-- Kabelbakke -->
    <path d="M3 26L29 10v5L3 29z" fill="currentColor"/>
    <path d="M3 26L29 10" stroke="#fff" stroke-width="1.4" opacity=".5"/>
  </symbol>
  <symbol id="v-skum" viewBox="0 0 32 32"><!-- Byggeskum -->
    <rect x="4" y="5" width="10" height="15" rx="2.5" fill="currentColor"/>
    <rect x="12" y="19" width="14" height="3.5" rx="1.5" fill="currentColor" opacity=".7"/>
    <circle cx="27.5" cy="18" r="3" fill="currentColor"/>
  </symbol>
  <symbol id="v-sten" viewBox="0 0 32 32">
    <path d="M6 20l5-11 10-3 7 8-4 12H9z" fill="currentColor"/>
  </symbol>
</svg>

<canvas id="laerred"></canvas>

<div id="hud" class="hud"></div>
<div id="panel"></div>
<div id="hjaelp" class="hjaelp"></div>
<div id="menu" class="menu"></div>

<div id="indlaeser" class="indlaeser hide">
  <div class="indl-kort">
    <svg viewBox="0 0 64 40" class="indl-pil" fill="currentColor"><use href="#i-arrow"/></svg>
    <div class="indl-tekst">Genererer bane…</div>
    <div class="indl-bar"><i></i></div>
  </div>
</div>

<noscript>
  <div class="noscript">Kundekrigen kræver JavaScript og WebGL.</div>
</noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
